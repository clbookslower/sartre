<script type="text/babel">
const { useState } = React;

const CONCEPTS = [
  { id:"liaison", core:true, term:"인식의 연결", latin:"la liaison de connaissance", keyword:"후설이 세울 수 있었던 유일한 연결",
    desc:"3절 전체를 관통하는 진단의 첫 항. 19·20세기 철학은 나와 타자를 두 개의 분리된 실체로 보는 한 유아론(唯我論 — 확실한 것은 내 의식뿐이고, 나 밖에 타인이 있다는 것은 끝내 확인할 수 없다는 입장)에서 벗어날 수 없음을 이해했고, 그래서 각각의 의식을 그 출현 자체에서 구성하게 될 근본적이며 초월적인 타자와의 결합을 의식들의 중심에서 포착하려 한다(p.510). 그런데 \"외적 부정의 가정을 포기한 것처럼 보여도, 사람들은 이 가정의 본질적 귀결을 여전히 간직하고 있다. 다시 말해 나와 타자와의 근본적 결합은 인식에 의해 실현된다는 주장이 그 귀결이다\"(pp.510-511).",
    example:"후설의 결산: \"후설은 존재를 의미의 계열로 환원시켰기 때문에, 나의 존재와 타자의 존재 사이에 후설이 세울 수 있었던 유일한 연결은 인식의 연결이다\"(p.515).", accent:"#c4a35a" },
  { id:"interiorite", core:true, term:"내면성의 길은 타인을 통과한다", latin:"le chemin de l'intériorité passe par autrui", keyword:"코기토 그 자체는 철학의 출발점이 될 수 없다",
    desc:"헤겔의 천재적 직관. 자기의식은 다른 자기의식들 속에서 자기를 인지하는 한에서만 현실적이며, \"매개자는 타인이다\"(p.516). 그래서 코기토(cogito — 데카르트의 \"나는 생각한다\". 의심할 수 없는 내 의식의 확실성, 근대 철학이 출발점으로 삼아 온 자리)는 개별성으로서의 나를 위한 나의 나타남의 결과로서만 생겨나고, 그 나타남은 타인의 인정에 의해 조건 지워진다. \"이렇게 해서 코기토 그 자체는 철학에 있어 하나의 출발점이 될 수 없을 것이다\"(p.517).",
    example:"\"타인의 문제는 코기토에서 출발해서 제기되기는커녕, 그 반대로 코기토를 내가 나 스스로를 대상으로 파악할 때의 추상적 계기로서 가능하게 만드는 것은 바로 타인의 존재이다\"(p.517).", accent:"#9a7abd" },
  { id:"separation", core:true, term:"의식들의 존재론적 분리", latin:"séparation ontologique", keyword:"타자-대상과 주체-나 사이에 공통의 척도가 없다",
    desc:"헤겔의 인식론적 낙관론이 무너지는 지점. 의식은 인식되기 전에 존재하며, \"대상으로 있음(être-objet)이 정확하게 이 나로-있지 않음(n'être-pas-moi)이라면, 하나의 의식에 있어 대상으로 있다는 사실은 의식을 근본적으로 변화시킨다\"(p.527). 그래서 \"타자-대상(l'objet-autrui)과 주체-나(moi-sujet) 사이에는 자기(에 대한) 의식과 타인에 대한 의식 사이에서와 마찬가지로 그 어떤 공통의 척도도 없다\"(p.529).",
    example:"\"이것을 우리는 의식들의 존재론적 분리(séparation ontologique)라고 부를 것이다\"(p.529). 헤겔의 낙관론은 여기서 실패로 귀결된다.", accent:"#5a9abc" },
  { id:"scandale", core:true, term:"다수성이라는 스캔들", latin:"le scandale", keyword:"헤겔은 자신의 고유한 의식을 망각했다",
    desc:"헤겔의 존재론적 낙관론에 대한 반격. 헤겔에게 진리는 전체(le Tout)의 진리이고, 그는 타인의 문제를 고찰하기 위해 전체의 관점 — 의식들의 외부, 절대자(l'Absolu)의 관점 — 에 자리를 잡는다(pp.529-530). \"사실상 헤겔은 자신의 고유한 의식을 망각했다. 그는 전체로 있다\"(p.530). \"하지만 비록 헤겔이 자신을 망각했다고 해도, 우리는 그를 망각할 수 없다\"(pp.530-531).",
    example:"\"따라서 그 어떤 논리적이거나 인식론적인 낙관론도 의식들의 다수성이라는 스캔들을 제거할 수는 없을 것이다\"(p.531). 각주 26: '나'의 이 세계의 출현이 설명 불가능하고 우연적인 사건이듯, '타인들'의 출현 역시 그렇다.", accent:"#c47a7a" },
  { id:"mitsein", core:true, term:"함께-있는-존재", latin:"Mit-Sein · l'être-avec", keyword:"나와 너가 아니라 우리(nous)이다",
    desc:"하이데거의 답. 인간실재(사르트르가 하이데거의 '현존재(Dasein)'를 옮긴 말 — 사물처럼 그냥 있는 것이 아니라 제 존재를 스스로 문제 삼는 존재, 곧 사람)를 특징짓는 \"세계-내-존재\"(사람은 세계를 나중에 만나는 것이 아니라 처음부터 세계 안에 놓여 있다는 뜻)의 세 계기 가운데, 내-존재가 아니라 남은 계기인 '존재'의 방식이 'Mit-Sein', 곧 함께-있는-존재다(p.533). 유대의 전형이 바뀐다 — 실재론·관념론·후설·헤겔에게 의식들의 관계 유형은 \"……에 대해-있음(l'être-pour)\"이었는데, 함께-있는-존재는 대립이 아니라 \"이 세계의 탐사를 위한 일종의 존재론적 연대성\"이다(pp.534-535). \"우리의 관계는 정면으로 이루어지는 대립이 아니다. 이 관계는 오히려 측면으로 이루어지는 상호 의존이다\"(p.535).",
    example:"\"[함께-있는-존재에 대한] 하이데거적 직관을 상징적으로 가장 잘 보여 주는 경험적 이미지는 투쟁의 이미지가 아니라 팀(équipe)의 이미지이다. 타인과 나의 의식과의 근원적인 관계는 나와 너가 아니라 우리(nous)이다\"(p.537).", accent:"#7aaa6a" },
  { id:"negint", core:true, term:"내적 부정 · 탈총체화된 총체성", latin:"négation interne · totalité détotalisée", keyword:"각 항은 자기를 다른 것으로부터 부인함으로써 구성된다",
    desc:"3절이 다음 절에 넘기는 요구. 타자는 코기토에게 나로 있지 않은 것으로 나타나야 하고, 그 부정은 순수한 외적 부정이 아니라 내적 부정이어야 한다 — \"이것은 두 항의 종합적·능동적 연결을 의미하며, 각 항은 자기를 다른 것으로부터 부인함으로써 구성된다. 따라서 이 부정적 관계는 상호적이며 이중의 내면성에 속할 것이다\"(p.548).",
    example:"\"'타자'의 다수성은 하나의 집합이 아니고 하나의 총체성임을 의미한다. 이 의미에서 우리는 헤겔이 옳다고 생각한다\"(p.548). 다만 이 총체성은 \"전체의 관점\"에 서는 것이 원칙상 불가능한 총체성 — 탈총체화된 총체성이다.", accent:"#d4b46a" },

  { id:"references", term:"참고 체계", latin:"des systèmes de références", keyword:"대상은 의식들의 무한한 다수성을 가리킨다",
    desc:"후설의 진보. 의식에 드러나는 세계는 상호 단자적인 세계(단자 — 라이프니츠의 말로, 창이 없어 서로 직접 통하지 못하는 개별 의식. 그런 의식들이 그럼에도 서로를 비추며 한 세계를 이룬다는 뜻)이고, \"타자는 단지 이렇게 저렇게 구체적·경험적으로 나타남으로써 세계에 현전할 뿐 아니라, 세계의 통일과 풍부성의 항상적 조건으로 세계에 현전한다\"(p.511). \"각각의 대상은 의식들의 무한한 다수성에 대한 참고 체계(des systèmes de références)를 갖는 것으로 근원적으로 주어진다\"(p.512).",
    example:"내가 이 탁자, 이 나무, 이 벽을 혼자 쳐다보든 사람들과 더불어 쳐다보든, 타자는 항상 내가 고려하는 대상 그 자체에 속하는 하나의 구성적인 의미층으로 존재한다(p.511).", accent:"#c4a35a" },
  { id:"transc", term:"선험적 주체들의 병행", latin:"le parallélisme des sujets transcendantaux", keyword:"입증해야 할 것은 경험적 자아들의 병행이 아니다",
    desc:"후설이 칸트와 갈라지지 못하는 자리. 나의 경험적 자아가 타자의 자아보다 더 확실하지 않음에도, 후설은 나의 자아와는 근본적으로 구별되고 칸트적 주체를 많이 닮은 선험적 주체(sujet transcendantal — '경험적 자아'가 오늘 밥을 먹고 화를 내는 살아 있는 나라면, '선험적 주체'는 그런 경험이 성립하도록 밑에 미리 깔려 있는 자리다. 경험 안에서는 만날 수 없다는 것이 문제다. 사르트르가 1937년 책에서 '초월적 자아'라 부른 것과 같은 말이다 — 원어가 둘 다 transcendantal이다)를 보존했다(p.512).",
    example:"\"입증해야 할 것은 누구에게도 의문의 여지가 없는 경험적 '자아들'의 병행 현상이 아니라 선험적 주체들의 병행 현상이다\"(p.512). 참된 문제는 경험 너머의 선험적 주체들의 연관에 대한 문제다(p.513).", accent:"#c4a35a" },
  { id:"absencehus", term:"부재로 정의된 타자 · 텅 빈 노에마", latin:"une absence · noème vide", keyword:"타자는 원칙적으로 자기를 거부하고 사라진다",
    desc:"후설도 이 어려움을 알고 있었다. 그는 우리의 구체적 경험에 나타나는 대로의 \"타자\"를 하나의 부재로 정의한다. 그런데 부재에 대한 충만한 직관을 어떻게 얻는가. \"타자는 텅 빈 지향들의 대상이다. 타자는 원칙적으로 [나에게] 자기를 거부하고 사라진다\"(p.514).\n\n지향이란 의식이 언제나 무엇인가를 향해 있다는 현상학의 기본 성질이고, 노에마는 그 향함 안에 잡히는 대상 쪽 내용이다. 노에마가 텅 비었다는 것은 — 향하기는 하는데 잡히는 것이 없다는 뜻이다.",
    example:"그 까닭은 타자가 애초에 세계 안에 없기 때문이다. \"그리고 타자는 본성상 세계 밖에 존재한다\"(p.513). 나에 의해 도달해야 할 것은 내가 인식하는 한에서의 타자가 아니라 타자가 자기에 대해 인식하는 한에서의 타자인데, 이것은 불가능하다(p.513).", accent:"#c4a35a" },
  { id:"moimoi", term:"나=나 · 확실성과 진리", latin:"moi = moi · Je suis je", keyword:"확실성은 아직 진리를 결여하고 있다",
    desc:"헤겔의 출발. 자기의식인 한에서 '나'는 스스로 자기를 파악하며, \"나=나(moi=moi)\" 또는 \"나는 나이다(Je suis je)\"라는 동일성이 이 사실을 표현한다. \"먼저 이 자기의식은 자신과의 순수한 동일성이며, 순수한 대자존재이다. 이 자기의식은 자기 자신에 대해 확실성을 가진다. 하지만 이 확실성은 아직 진리를 결여하고 있다\"(p.515).",
    example:"자신의 고유한 대자적 존재가 이 자기의식에게 독립된 대상으로서 나타나는 한에서만 이 확실성은 참된 확실성이 된다(pp.515-516). 그 매개자가 타인이다(p.516).", accent:"#9a7abd" },
  { id:"maitre", term:"주인과 노예", latin:"maître et esclave", keyword:"노예는 주인의 진리이다",
    desc:"인정을 위한 투쟁. 타자가 나를 인정하도록 하기 위해 나는 나 자신의 고유한 생명을 내걸면서 위험을 무릅써야 한다. 이와 동시에 나는 타인의 죽음을 추구한다(p.518). 타인이 생명과 자유를 선호함으로써 대상적 형태에 묶여 있지 않은 자로서 처신할 수 없음을 보여 줄 때, \"타인은 노예이고, 나는 주인이다\"(p.518).",
    example:"\"우리에게는 노예는 주인의 진리라는 사실을 지적하는 것으로 충분하다\"(p.518). 그러나 이런 일방적이고 불평등한 인정은 불충분하다 — 노예의 자기 확신의 진리는 주인에게는 비본질적 의식이기 때문이다(p.519).", accent:"#9a7abd" },
  { id:"epist", term:"인식론적 낙관론", latin:"optimisme épistémologique", keyword:"여기에서도 존재의 척도는 여전히 인식이다",
    desc:"헤겔 비판 ①. 헤겔은 의식들의 존재에 대한 문제를 제기했으나 \"이런 존재론적 문제가 모든 곳에서 인식의 용어로 표현되어 있는 것 역시 확실하다\"(p.520). \"여기에서도 존재의 척도는 여전히 인식이다\"(p.520). \"첫째, 우리가 보기에 헤겔은 인식론적 낙관론이라는 오류를 범한 것 같다\"(p.523).",
    example:"여기에서 사르트르는 키르케고르를 헤겔에 대립시킨다(헤겔이 개별자를 전체 속의 한 계기로 다룬 데 맞서, 키르케고르는 평생 '이 한 사람'을 붙들었다) — \"개별자가 요구하는 것은 개별자로서의 자기의 완성이다. 개별자는 구체적인 자기의 존재에 대한 승인을 요구하는 것이지, 하나의 보편적인 구조에 대한 객관적인 설명을 요구하는 것이 아니다\"(p.523).", accent:"#5a9abc" },
  { id:"ontol", term:"존재론적 낙관론 · 전체의 관점", latin:"optimisme ontologique · le Tout", keyword:"진리는 전체의 진리이다",
    desc:"헤겔 비판 ②. \"헤겔에게 있어 사실 진리는 전체(le Tout)의 진리이다. 그리고 헤겔은 타인의 문제를 고찰하기 위해 진리의 관점, 다시 말해 전체의 관점에 자리를 잡는다\"(p.529). 그는 어떤 개별적인 의식 개체 속에도 자리를 잡고 있지 않고, 의식들의 외부에서 절대자의 관점에서 고찰한다(p.530).",

  { id:"objetpas", term:"대상으로 있음 = 나로-있지 않음", latin:"être-objet · n'être-pas-moi", keyword:"나는 나 자신에게 있어 대상으로 있을 수 없는 자이다",
    desc:"헤겔이 대상성과 생명을 혼동한 자리를 사르트르가 가르는 칼. 의식의 존재는 자기의 존재 속에 자기의 존재가 문제 되는 방식으로 존재하며, 이것은 의식이 순수한 내면성임을 의미한다. \"따라서 의식의 존재는 모든 대상성의 철저한 배제이다. 나는 나 자신에게 있어 대상으로 있을 수 없는 자이며, 자기에 대해서는 대상의 형태로 그 존재를 생각해 볼 수조차 없는 자이다\"(p.526).",
    example:"\"나는 나에게서 벗어날 수 없다. 나는 나를 뒤에서 다시 붙잡는다\"(p.527). 바로 앞 문장 \"나는 도처에서 나를 따라간다\"에 붙은 각주 24는, 원어 'suis'를 'être'가 아니라 '쫓아간다'는 뜻의 'suivre'로 읽어 옮겼다고 밝힌다.", accent:"#5a9abc" },
  { id:"on", term:"사람들 · 누구라도 상관없는 자", latin:"on · quiconque", keyword:"본래성과 개별성은 서로 다툰다",
    desc:"하이데거의 비본래성. 기성복, 대중교통, 공원, 정원, 광장, 누구라도 가서 피난할 수 있게 만들어진 방공호(p.536). 이것들은 나를 위해 만들어진 것이 아니라 '아무나'를 위해 만들어졌고, 그래서 그 앞에 선 나도 '아무나'가 된다.\n\n하이데거는 이렇게 사는 방식을 \"사람들(on)\"이라 부른다. 이때 세계는 도구적 복합(서로 물려 돌아가는 도구들의 그물)의 모습으로 나를 비본래적 가능성(내가 고른 것이 아니라 이미 마련되어 있던 가능성)의 비인칭적 반영과 같은 것으로 가리킨다(p.536).",
    example:"\"이렇게 해서 나는 '목적이 되는 누구인가(pour qui, Worumwillen)'로 나를 가리키는 지시적인 도구적 복합에 의해 나를 누구라도 상관없는 자(quiconque)로 나를 알려 준다\"(p.536). \"본래성과 개별성은 서로 다툰다\"(p.537).", accent:"#7aaa6a" },
  { id:"equipe", term:"팀 · 공동의 고독", latin:"équipe · solitude commune", keyword:"노의 리듬이 조수들에게 느낄 수 있게 하는 공동존재",
    desc:"하이데거적 직관의 가장 아름다운 그림. 함께-있는-존재는 다른 개인 앞에서 한 개인이 차지하고 있는 명확한 위치가 아니며 인식도 아니다. \"그것은 자기 팀 동료들과의 암묵적인 공동존재이다. 다시 말해 노의 리듬이나 또는 조타수의 규칙적 동작들이 조수들에게 느낄 수 있게 하는 공동존재이며, 또 도달해야 공동의 목표, 추월해야 할 보트 또는 여러 사람이 젓는 보트, 지평선 위에 떠오르는 전체 세계(관중, 경기 등)가 그들에게 드러내 보이는 공동존재이다\"(p.537).",
    example:"\"나의 죽음을-향한-존재(mon être-pour-mourir)의 갑작스러운 드러남이 느닷없이 나를 하나의 절대적 '공동의 고독' 속에 떠오르게 함과 동시에 타인들을 이 고독에까지 올려놓는 것은 바로 이 공현존의 공동의 지반 위에서이다\"(p.537).", accent:"#7aaa6a" },
  { id:"contingente", term:"우연적 필연성", latin:"nécessité contingente · nécessité de fait", keyword:"사람들은 타자를 만나는 것이지 구성하는 것이 아니다",
    desc:"하이데거 비판에서 얻는 새로운 소득. \"타자의 존재는 하나의 우연적이고 환원 불가능한 사실이라는 본성을 가지고 있기 때문이다. 사람들은 타자를 만나는 것이지, 타자를 구성하는 것이 아니다\"(p.543). 그러니 타자존재의 필연성이 있다면, 그것은 \"우연적 필연성(nécessité contingente)\"에 속하는 것이라야 한다(p.544).",
    example:"\"다시 말해 타자존재의 필연성은 그와 함께 코기토가 부과되는 사실상의 필연성(nécessité de fait)의 유형 자체에 속하는 것이라야 한다\"(p.544).", accent:"#bc7a7a" },
  { id:"probable", term:"타자는 개연성일 수 없다", latin:"la probabilité", keyword:"나는 억측하지 않는다, 나는 긍정한다",
    desc:"결론 (1)의 뼈대. 개연성은 확인이나 파기가 매 순간 가능할 경우에만 존재한다. 타자가 원칙상 나의 경험 밖에 존재한다면 그의 존재의 개연성은 결코 확인될 수도 파기될 수도, 커질 수도 줄어들 수도, 측정될 수도 없다(p.545). \"한마디로 말하면 타자의 존재는 하나의 개연성일 수 없다\"(p.544).",
    example:"랄랑드의 예 — 화성에 생물이 존재한다는 가설은 확인하거나 파기할 도구가 없는 한 억측으로 남는다(p.545). \"하지만 정확히 나는 타자의 존재를 억측하지 않는다. 나는 타자의 존재를 긍정한다\"(p.545).", accent:"#bc7a7a" },
  { id:"cogitoautrui", term:"타자존재의 코기토", latin:"le cogito de l'existence d'autrui", keyword:"나는 결코 코기토를 실천하기를 그만두지 않았다",
    desc:"결론 (2)의 뼈대. 데카르트는 자신의 존재를 증명하지 않았다 — \"나는 사실 내가 존재하고 있었던 것을 항상 알고 있기 때문이다\"(p.546). 유아론에 대한 나의 저항 역시 타자가 존재하고 있음을 내가 항상 알고 있었다는 것, 타자의 존재에 대한 총체적인 \"전 존재론적\" 이해를 항상 가졌음을 증명해 준다(p.546).",
    example:"\"이렇게 해서 우리가 어쩔 수 없이 타자존재의 코기토라고 부른 것은 나 자신의 코기토와 혼동된다\"(p.546). 코기토가 나를 자기 밖의 즉자(卽自 — 자기와 거리를 두지 못하고 그냥 그것으로 꽉 차 있는 사물의 존재 방식. 반대편의 대자(對自)가 자기를 문제 삼는 의식의 방식이다) 위로 내던진 것처럼, 나를 자기 밖의 타자 위로 내던져야 한다.", accent:"#bc7a7a" },
];

const PASSAGES = [
  { title:"논점 1 · 후설 — 인식으로 존재를 측정하려다",
    note:"p.510 'Ⅲ. 후설, 헤겔, 하이데거' 도입부터 p.515 초입까지. 키워드 셋 — '인식에 의한 결합' '선험적 주체' '부재'. 3절의 세 철학자가 공유하는 하나의 가정이 도입부에 명시되어 있습니다. 그 문장부터 밑줄을 그어 두시면 이후 스무 쪽이 한 줄로 꿰입니다.",
    layers:[
      { label:"핵심 주장", text:"3절은 진단으로 열린다. \"만일 사람들이 먼저 나 자신과 타자를 두 개의 분리된 실체의 양상 아래 고찰한다면, 19세기와 20세기의 철학은 유아론에서 벗어날 수 없음을 이해한 것처럼 보인다\"(p.510). 그래서 현대의 이론들은 각각의 의식을 그 출현 자체 속에서 구성하게 될 근본적이며 초월적인 타자와의 결합을 의식들의 중심에서 포착하려 한다.\n\n그런데 함정이 남아 있다. \"하지만 외적 부정의 가정을 포기한 것처럼 보여도, 사람들은 이 가정의 본질적 귀결을 여전히 간직하고 있다. 다시 말해 나와 타자와의 근본적 결합은 인식에 의해 실현된다는 주장이 그 귀결이다\"(pp.510-511).\n\n후설이 첫 시험대다. 『데카르트적 성찰』과 『형식논리학과 선험논리학』에서 그는 타자에의 의거가 세계의 구성에 필수 불가결한 조건임을 보여 주면 유아론이 반박된다고 생각했다(p.511)." },
      { label:"왜 그런가", text:"후설의 진보는 실재하고 크다. 의식에 드러나는 대로의 세계는 상호 단자적인 세계이고, \"타자는 단지 이렇게 저렇게 구체적·경험적으로 나타남으로써 세계에 현전할 뿐 아니라, 세계의 통일과 풍부성의 항상적 조건으로 세계에 현전한다\"(p.511). \"각각의 대상은 의식들의 무한한 다수성에 대한 참고 체계(des systèmes de références)를 갖는 것으로 근원적으로 주어진다\"(p.512). '타자'라는 의미는 경험에서 올 수도, 유추에 의한 추리에서 올 수도 없다 — 반대로 경험이 해석되는 것이 타자 개념의 빛에 의해서다(p.512).\n\n그런데도 사르트르는 후설이 칸트와 현저히 다르게 보이지 않는다고 말한다. 후설이 선험적 주체(sujet transcendantal)를 보존했기 때문이다. \"입증해야 할 것은 누구에게도 의문의 여지가 없는 경험적 '자아들'의 병행 현상이 아니라 선험적 주체들의 병행 현상이다\"(p.512).\n\n그리고 그 주체들은 만날 수 없다. \"그리고 타자는 본성상 세계 밖에 존재한다\"(p.513). 인식이 존재를 측정한다 해도, 타자의 존재가 그 실재에서 측정되는 것은 타자가 자신에 대해 갖는 인식에 의한 것이지 내가 갖는 인식에 의한 것이 아니다. \"나에 의해 도달해야 할 것은, 내가 타자에 대해 인식하는 한에서의 타자가 아니고, 타자가 자기에 대해 인식하는 한에서의 타자이다. 하지만 이것은 불가능하다\"(p.513)." },
      { label:"비유로", text:"후설은 타자를 하나의 부재로 정의한다(p.514). 부재는 자리를 가리키는 이름이지 얼굴이 아니다. 빈 의자는 여기 누가 있었음을 알려 주지만, 그 사람을 내주지는 않는다. \"타자는 텅 빈 지향들의 대상이다. 타자는 원칙적으로 [나에게] 자기를 거부하고 사라진다. 따라서 남아 있는 유일한 실재는 나의 지향의 실재이다\"(p.514).\n\n사르트르는 여기서 자기 자신을 함께 벤다. 여섯 해 전 그는 후설의 이 선험적 주체만 걷어 내면 유아론이 풀린다고 믿었다. \"나는 예전에 후설에게서 그의 초월적 '자아'를 거부함으로써 유아론에서 벗어날 수 있다고 생각했다\"(p.514, 『자아의 초월성』 1937 — '초월적 자아'는 앞의 '선험적 주체'와 같은 말이다). 지금 그는 그 믿음을 스스로 취소한다. 선험적 주체를 포기했다고 해서 타자의 존재 문제가 한걸음이라도 진척된 것은 아니었다(p.515). 문을 하나 없앤다고 벽이 사라지지는 않는다.\n\n그래서 첫 결산이 나온다. \"이처럼 후설은 존재를 의미의 계열로 환원시켰기 때문에, 나의 존재와 타자의 존재 사이에 후설이 세울 수 있었던 유일한 연결은 인식의 연결이다. 그만큼 후설은 칸트와 마찬가지로 유아론에서 벗어날 수 없을 것이다\"(p.515)." },

  { title:"논점 2 · 헤겔 — 존재와 인식을 동일화하려다",
    note:"p.515 '만일 연대적 계기의 규칙들을 준수하지 않고'부터 p.532 '헤겔은 인식과 존재를 동일화하려다 실패한 것이다'까지. 키워드 셋 — '내면성의 길' '두 개의 낙관론' '스캔들'. 사르트르가 헤겔을 얼마나 높이 평가하는지 먼저 보고, 그다음 어디서 갈라서는지 보세요 — 칭찬과 반박이 한 몸입니다.",
    layers:[
      { label:"핵심 주장", text:"헤겔의 해결책은 후설에 비해 중요한 진전이다. \"타자의 출현은 자기의식으로서의 나의 의식의 존재 자체에 대해 필수 불가결하다\"(p.515). 자기의식은 자신과의 순수한 동일성 — \"나=나(moi=moi)\" 또는 \"나는 나이다(Je suis je)\" — 이지만, \"이 확실성은 아직 진리를 결여하고 있다\"(p.515).\n\n그 진리로 가는 길에 타인이 서 있다. \"매개자는 타인이다. 타인은 나 자신과 함께 나타난다\"(p.516). \"이렇듯 최초의 사실은 의식의 다수성이다. 그리고 이 다수성은 이중의 상호적 배제 관계의 형태하에 실현된다\"(p.516).\n\n여기서 우리가 요구했던 것이 나온다 — 내면성에 의한 부정의 유대. \"외적이며 즉자적인 어떤 무도 나의 의식을 타자의 의식에서 분리하지 않는다. 내가 타인을 배제하는 것은 오히려 나로 있다는 사실 자체에 의해서이다\"(p.516). \"의식들은 그것들의 존재가 고기비늘처럼 서로 직접적으로 의존하고 있다\"(p.516). 비늘이 서로 겹쳐 물려 있어 하나가 움직이면 옆이 함께 움직이듯이." },
      { label:"왜 중요한가", text:"그래서 헤겔은 코기토를 출발점에서 끌어내린다. \"이렇게 해서 코기토 그 자체는 철학에 있어 하나의 출발점이 될 수 없을 것이다\"(p.517). \"타인의 문제는 코기토에서 출발해서 제기되기는커녕, 그 반대로 코기토를 내가 나 스스로를 대상으로 파악할 때의 추상적 계기로서 가능하게 만드는 것은 바로 타인의 존재이다\"(p.517). 한 문장으로 — \"내면성의 길은 타인을 통과한다\"(p.517).\n\n인정을 위한 투쟁이 뒤따르고 주인과 노예가 나온다. \"노예는 주인의 진리\"(pp.518-519)지만 일방적 인정은 불충분하다(p.519).\n\n그럼에도 결정적 소득이 있다. \"자기의식은 다른 하나의 자기의식 속에서 자기의 반향(그리고 자기의 반영)을 알아보는 한도에서만 현실적인 자기의식이다\"(p.519, 헤겔 『철학 예비학』). \"그렇기 때문에 나는 나 자신을 의심하지 않고서는 타인을 의심할 수 없다\"(p.519). \"이렇듯 유아론은 결정적으로 전투력을 상실한 것처럼 보인다\"(p.519)." },
      { label:"어디서 갈라서나", text:"그러나 사르트르는 묻는다. \"그렇지만 이 해결책은 그 넓은 폭에도 불구하고, 또 주인과 노예의 이론 속에서 꿈틀거리는 세밀한 논거들의 풍부함과 깊이에도 불구하고, 과연 우리를 만족시켜 줄 것인가?\"(p.520)\n\n문제는 존재론적으로 제기되었으나 모든 곳에서 인식의 용어로 표현되어 있다 — \"여기에서도 존재의 척도는 여전히 인식이다\"(p.520). 여기서 두 개의 낙관론이 갈라져 나온다.\n\n① 인식론적 낙관론(p.523). 의식은 인식되기 전에 존재한다. 그리고 \"대상으로 있음(être-objet)이 정확하게 이 나로-있지 않음(n'être-pas-moi)이라면, 하나의 의식에 있어 대상으로 있다는 사실은 의식을 근본적으로 변화시킨다\"(p.527). 그래서 타자-대상과 주체-나 사이에는 공통의 척도가 없다 — \"이것을 우리는 의식들의 존재론적 분리라고 부를 것이다\"(p.529).\n\n② 존재론적 낙관론(p.529). \"헤겔에게 있어 사실 진리는 전체(le Tout)의 진리이다.\" 그는 타인의 문제를 고찰하기 위해 전체의 관점, 곧 의식들의 외부·절대자의 관점에 자리를 잡는다(pp.529-530).\n\n두 낙관론을 헷갈리지 마세요 — ①은 척도를 잘못 골랐다는 지적이고, ②는 서 있는 자리를 잘못 잡았다는 지적입니다." },
      { label:"비유로", text:"둘째 비판은 아주 간단한 지적으로 이루어진다. 지도를 그리는 사람은 지도 위에 자기가 서 있는 자리를 찍어야 한다. 헤겔은 찍지 않았다. \"사실상 헤겔은 자신의 고유한 의식을 망각했다. 그는 전체로 있다\"(p.530). 그러니 그에게는 이 주제와 관련된 참된 문제가 결코 제기된 적이 없었다.\n\n그런데 잊는 일은 일방적이지 않다. \"하지만 비록 헤겔이 자신을 망각했다고 해도, 우리는 그를 망각할 수 없다\"(pp.530-531). 이것은 우리가 코기토를 가리키고 있음을 의미한다. \"한마디로 유일하게 확실한 출발점은 코기토의 내면성이다\"(p.531). 나는 물론 하나의 전체를 향해 나를 초월할 수 있지만, 나를 관조하고 또 타자를 관조하는 나를 그 전체 속에 세울 수는 없다.\n\n그래서 \"따라서 그 어떤 논리적이거나 인식론적인 낙관론도 의식들의 다수성이라는 스캔들을 제거할 수는 없을 것이다\"(p.531). 존재론이 할 수 있는 임무는 이 스캔들을 서술하고 존재의 본성 자체 속에서 그것에 근거를 마련하는 일이지, 뛰어넘는 일이 아니다.\n\n긴 비판이 남긴 것은 한 줄이다. \"유아론이 반박되어야 한다면, 그것은 나의 타자에 대한 관계는 먼저, 그리고 근본적으로 존재와 존재의 관계이지, 인식과 인식과의 관계가 아니기 때문이라는 사실이 그것이다\"(p.532). \"후설은 이 특수한 경우에 존재를 인식으로 측정하려다가 실패했고, 헤겔은 인식과 존재를 동일화하려다 실패한 것이다\"(p.532)." },
    ]},
  { title:"논점 3 · 하이데거 — 존재로 옮겼으나, 만남이 남았다",
    note:"p.532 '하이데거는 『존재와 시간』에서'부터 p.548 절 끝까지. 키워드 셋 — '함께-있는-존재(Mit-Sein)' '존재론적 차원과 존재적 차원' '내적 부정'. 앞의 둘과 달리 하이데거는 요구를 만족시키는 듯 보입니다 — 그런데도 왜 부족한지, 그 '왜'가 4절로 가는 문입니다.",
    layers:[
      { label:"핵심 주장", text:"하이데거는 선구자들의 고찰에서 교훈을 이끌어 내고 이중의 필요성을 깊이 통찰한다. \"(1) '인간실재들'의 관계는 존재 관계라야 한다. (2) 이 관계는 '인간실재들'을 그들의 본질적 존재에서 서로 의존시키는 것이라야 한다\"(p.532).\n\n다만 방식이 거칠다. \"어려운 문제의 실마리를 풀어 보려고 노력하기보다는 오히려 고르디우스의 매듭을 끊어 버리는 성급하고 조금은 난폭한 방식으로 그는 하나의 단순한 정의에 의해 제기된 문제에 답하고 있다\"(pp.532-533). 세계-내-존재의 계기는 세계·내-존재·존재 셋인데, 내-존재는 심상성(Befindlichkeit)과 이해(Verstand)로 규정된다. 남은 계기인 존재 — 인간실재가 그의 세계-내-존재로 있는 방식 — 가 'Mit-Sein', 곧 함께-있는-존재다(p.533).\n\n유대의 전형 자체가 변한다. 실재론·관념론·후설·헤겔에게 의식들 사이의 관계 유형은 \"……에 대해-있음(l'être-pour)\"이었다. 그러나 함께-있는-존재는 인정과 투쟁의 상호적 관계가 아니라 \"이 세계의 탐사를 위한 일종의 존재론적 연대성\"을 표현한다(pp.534-535). \"타인은 대상이 아니다. 타인은 나와의 관계 속에서 인간실재로 머문다\"(p.535). \"우리의 관계는 정면으로 이루어지는 대립이 아니다. 이 관계는 오히려 측면으로 이루어지는 상호 의존이다\"(p.535)." },
      { label:"왜 중요한가", text:"그 그림이 팀이다. \"[함께-있는-존재에 대한] 하이데거적 직관을 상징적으로 가장 잘 보여 주는 경험적 이미지는 투쟁의 이미지가 아니라 팀(équipe)의 이미지이다. 타인과 나의 의식과의 근원적인 관계는 나와 너가 아니라 우리(nous)이다\"(p.537). 노의 리듬, 조타수의 규칙적 동작, 추월해야 할 보트, 지평선 위로 떠오르는 관중 — 그것이 공동존재다. 그리고 \"나의 죽음을-향한-존재의 갑작스러운 드러남이 느닷없이 나를 하나의 절대적 '공동의 고독' 속에 떠오르게 함과 동시에 타인들을 이 고독에까지 올려놓는 것은 바로 이 공현존의 공동의 지반 위에서이다\"(p.537).\n\n사르트르는 이것을 인정한다. \"이번에는 우리가 계속 요구했던 것이 마침내 주어졌다. 즉 타자의 존재를 자기 존재 안에 품고 있는 하나의 존재가 그것이다\"(p.538). 그러나 곧바로 덧붙인다 — \"그렇지만 우리는 그것으로 만족할 수는 없을 것이다.\" \"하이데거의 이론은 문제의 해결책 자체보다 오히려 찾아내야 할 해결책의 지시를 우리에게 제공해 준다\"(p.538).\n\n반대의 핵심은 하나다. \"무엇보다도 먼저, 여기에서는 존재론적 관점이 칸트적 주체의 추상적 관점과 다시 합쳐진다\"(p.539). 인간실재가 본성상·보편적 자격으로 함께 있다는 주장이 증명된다 해도, 그것은 어떤 구체적인 함께-있는-존재도 설명해 주지 못한다. 증명되어야 하는 것은 \"피에르와-함께-있음\" 또는 \"아니와-함께-있음\"이 나의 구체적인 존재를 구성하는 하나의 구조라는 사실이다(p.539). \"이 타인은 추상적인 하나의 항이고, 따라서 비독립적이며, 피에르나 아니라는 이 타인이 될 힘을 자기 내부에 가지고 있지 않다\"(p.539).\n\n이 어긋남에는 이름이 있다. 존재론적 차원(존재의 구조 일반에 관한 층)에서 증명된 것이 존재적 차원(지금 여기 이 사람, 피에르라는 한 명에 관한 층)으로 내려오지 못하는 것이다. 사람들은 이것이 하이데거가 \"일반적으로는 존재론적 차원에서 존재적 차원으로\" 이행할 때 겪는 어려움의 한 양상일 뿐이라고 말할 것이다. 다른 경우에는 그 어려움이 숨겨질 수 있다. \"하지만 반대로 타자의 문제에 있어서는 한쪽 차원에서 다른 쪽 차원으로의 이행이 불가능하다는 것이 드러난다\"(p.540).\n\n그래서 다리가 놓이지 않는다. \"게다가 나의 함께-있는-존재는 타자의 존재에 대한 최소한의 증거도 구성하지 않으며, 또 나와 타인 사이의 최소한의 교량 역할도 하지 않는다\"(p.541). 선험적 관계는 타자와의 관계의 모든 가능성을 고갈시켜 버리기 때문이다. 결론은 뼈아프다 — \"나의 존재의 구조로서 생각된 함께-있는-존재는 유아론의 논법과 마찬가지로 확실하게 나를 고립시킨다\"(p.542). \"하이데거는 관념론에서 벗어나지 못하고 있다\"(p.542)." },
      { label:"비유로", text:"그런데 비판에서 새 것이 하나 남는다. \"타자의 존재는 하나의 우연적이고 환원 불가능한 사실이라는 본성을 가지고 있기 때문이다. 사람들은 타자를 만나는 것이지, 타자를 구성하는 것이 아니다\"(p.543). 설계도에 문이 그려져 있다고 해서 누가 들어오는 것은 아니다. 들어오는 일은 일어나는 일이다. 그러니 필연성이 있다면 \"우연적 필연성(nécessité contingente)\", 곧 코기토가 부과되는 것과 같은 사실상의 필연성이다(p.544).\n\n네 개의 조건이 뒤따른다.\n\n① 유아론이 배척되어야 하는 것은 새 증거가 나와서가 아니라 \"이 유아론이 성립 불가능하기 때문이며, 또는 이렇게 말하면, 누구도 진실로 유아론자가 아니기 때문이다\"(p.544). \"타자의 존재는 하나의 개연성일 수 없다\"(p.544) — \"나는 타자의 존재를 억측하지 않는다. 나는 타자의 존재를 긍정한다\"(p.545).\n\n② \"가능한 유일한 출발점은 데카르트의 코기토였다\"(p.546). 다만 코기토가 나를 자기 밖의 즉자 위로 내던진 것처럼 나를 자기 밖의 타자 위로 내던져야 한다 — \"나 자신의 가장 깊은 곳에서 나는 타자의 존재를 믿는 이유를 발견해야 하는 것이 아니라, 차라리 나로 있지 않는 자로서의 타자 자신을 발견해야 한다\"(p.547).\n\n③ 코기토가 드러내 보여야 할 것은 대상-타자가 아니다 — 대상이면 개연성으로 되돌아간다(p.547).\n\n④ 그 부정은 외적 부정이 아니라 내적 부정이라야 한다. \"이것은 두 항의 종합적·능동적 연결을 의미하며, 각 항은 자기를 다른 것으로부터 부인함으로써 구성된다\"(p.548).\n\n그리고 마지막 한 걸음. \"'타자'의 다수성은 하나의 집합이 아니고 하나의 총체성임을 의미한다. 이 의미에서 우리는 헤겔이 옳다고 생각한다\"(p.548). 다만 이 총체성은 \"전체의 관점\"에 서는 것이 원칙상 불가능한 총체성 — 탈총체화된 총체성이다(p.548).\n\n\"이 몇 가지 지적으로부터 출발해서 우리는 이제 타자의 문제에 접근하고자 시도할 것이다\"(p.548). 다음 절이 시선(le regard)이다." },
    ]},
];

      <div style={{ background:"#0f1418", border:`1px solid ${STAGES.logic.color}33`, padding:"20px 26px", maxWidth:640, width:"100%", textAlign:"left", marginBottom:28 }}>
        <p style={{ fontSize:11, color:STAGES.logic.color, letterSpacing:4, marginBottom:10, fontWeight:500 }}>다음 시간 예고</p>
        <p style={{ ...MT, fontSize:13, margin:0, lineHeight:1.9 }}>"이 몇 가지 지적으로부터 출발해서 우리는 이제 타자의 문제에 접근하고자 시도할 것이다"(p.548). 3절은 여기서 닫히고, <strong style={{color:"#8ab6cd"}}>4절 시선(le regard)</strong>이 열립니다. 사르트르 자신의 답이 나오는 자리입니다.</p>
      </div>
      <div style={{ display:"flex", gap:32, marginBottom:52, justifyContent:"center" }}>
        {[["문법","Grammar","#c4a35a"],["논리","Logic","#5a9abc"],["수사","Rhetoric","#bc7a7a"]].map(([l,e,col])=>(
          <div key={l} style={{ textAlign:"center" }}>
            <div style={{ width:5, height:5, borderRadius:"50%", background:col, margin:"0 auto 8px" }} />
            <p style={{ fontFamily:F.b, fontSize:11, color:col, letterSpacing:3, marginBottom:5 }}>{l}</p>
            <p style={{ fontFamily:F.h, fontSize:13, color:C.muted, margin:0, fontStyle:"italic" }}>{e}</p>
          </div>
        ))}
      </div>
      <button onClick={()=>go(0)} style={{ background:"transparent", border:`1px solid ${C.line}`, color:C.muted, fontFamily:F.b, fontSize:11, letterSpacing:4, padding:"12px 32px", cursor:"pointer" }}>처음으로</button>
    </div>
  );

  default: return null;
  }};

  const navVisible = page>0 && page<10;
  return (
    <div style={{ background:C.bg, minHeight:"100vh" }}>
      {navVisible && (
        <div style={{ position:"fixed", top:0, left:0, right:0, height:2, background:C.line, zIndex:100 }}>
          <div style={{ height:"100%", width:`${((page-1)/8)*100}%`, background:stage?stage.color:C.gold, transition:"width 0.4s ease, background 0.4s ease" }} />
        </div>
      )}
      <div style={{ opacity:fading?0:1, transition:"opacity 0.28s ease", paddingTop:navVisible?2:0 }}>
        {renderPage()}
      </div>
      {navVisible && (
        <div style={{ maxWidth:720, margin:"0 auto", padding:"0 28px 52px", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
          <button onClick={prev} style={{ background:"transparent", border:"none", color:C.muted, fontFamily:F.b, fontSize:12, letterSpacing:3, cursor:"pointer", padding:"12px 0" }}>← 이전</button>
          <div style={{ display:"flex", gap:4, alignItems:"center" }}>
            {Array.from({length:9},(_,i)=>{
              const ps=PAGE_STAGE[i+2], col=ps?STAGES[ps].color:C.gold, active=i===page-2, done=i<page-2;
              return <div key={i} style={{ width:active?8:5, height:active?8:5, borderRadius:"50%", background:done||active?col:C.line, transition:"all 0.3s" }} />;
            })}
          </div>
          {page<9 ? (
            <button onClick={next} style={{ background:"transparent", border:"none", color:stage?stage.color:C.gold, fontFamily:F.b, fontSize:12, letterSpacing:3, cursor:"pointer", padding:"12px 0" }}>다음 →</button>
          ) : (
            <button onClick={next}
              onMouseEnter={e=>{e.currentTarget.style.background=STAGES.rhetoric.color;e.currentTarget.style.color=C.bg;}}
              onMouseLeave={e=>{e.currentTarget.style.background="transparent";e.currentTarget.style.color=STAGES.rhetoric.color;}}
              style={{ background:"transparent", border:`1px solid ${STAGES.rhetoric.color}`, color:STAGES.rhetoric.color, fontFamily:F.b, fontSize:11, letterSpacing:3, padding:"10px 24px", cursor:"pointer", transition:"all 0.3s" }}>
              마무리
            </button>
          )}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
