<script type="text/babel">
const { useState } = React;

const CONCEPTS = [
  { id:"soucimoi", term:"대아적 염려", latin:"pour-moi · 對我的", keyword:"대아적으로 있지 않으면서 나의 존재로 있는 존재",
    desc:"3부의 문을 여는 발견. '대아적(對我的)'은 '나에 대한'이라는 뜻이고, '반성적 기술'의 기술은 묘사한다는 뜻의 기술(記述)이다. 나를 묘사하는 반성의 태도에서 벗어나지 않고서도 우리는 근본적으로 다른 유형의 존재론적 구조를 가리키는 의식의 방식을 만난다. \"이 존재론적 구조는 나의 존재론적 구조이고, 내가 염려하는 것은 나 자신의 문제에 대한 것이다. 그렇지만 이 '대아적(對我的)' 염려는 대아적으로 있지 않으면서 나의 존재로 있는 하나의 존재를 나에게 드러내 보인다\"(p.487).",
    example:"나를 향한 염려인데, 그 염려가 드러내는 존재는 '나에 대해' 있는 방식으로 있지 않다 — 수치심이 바로 그 예다(p.487).", accent:"#c4a35a" },

  { id:"honte", core:true, term:"수치심", latin:"la honte", keyword:"제1차적 구조에서 누군가의 앞에서의 수치심",
    desc:"\"수치심은 수치심으로서의 자기(에 대한) 비정립적 의식이다\"(p.487). '비정립적'이란 자기를 대상으로 세워 놓고 바라보지 않는다는 뜻 — '나는 수치스럽다'고 생각하기 전에 이미 수치로 살아지는 의식이다. 독일인들이 '체험'이라고 부르는 것의 한 예. 그 구조는 지향적이다 — \"무엇인가에 대한 수치스러운 파악이며, 이 무엇인가는 바로 나이다\"(p.488). 나는 수치심에 의해 나의 존재의 한 양상을 발견한다. 그리고 수치심은 근원적으로 하나의 반성 현상이 아니다. \"수치심은 그것의 제1차적 구조에서 누군가의 앞에서의 수치심이다\"(p.488).",
    example:"서툴거나 야비한 몸짓을 했다. 판단도 비난도 없이 그저 체험한다. 그런데 고개를 든다 — 누군가가 거기에 있었고, 나를 본 것이다. 그 순간 야비함이 실감되고 수치심이 밀려온다(p.488).", accent:"#9a7abd" },

  { id:"mediateur", core:true, term:"매개자로서의 타자", latin:"médiateur", keyword:"타자는 나와 나 자신 사이의 필요 불가결한 매개자",
    desc:"\"타자는 나와 나 자신 사이의 필요 불가결한 매개자이다. 나는 내가 타자에게 나타나는 대로의 나에 대해 수치심을 느끼는 것이다\"(p.488). 타자의 출현 자체에 의해 나는 나 자신에 대해 마치 하나의 대상에 대해서처럼 판단을 내릴 수 있게 된다 — 나는 타자에게 대상으로 나타나기 때문이다(p.488).",
    example:"반성의 장에서 나는 나의 것인 의식만을 만날 뿐이다. 내가 나를 대상처럼 보게 되는 것은 오직 타자를 거쳐서다(p.488).", accent:"#c47a7a" },

  { id:"reconnaissance", core:true, term:"인정", latin:"reconnaissance", keyword:"타자가 나를 보는 것같이 내가 존재한다",
    desc:"\"수치심은 본질상 인정(reconnaissance)이다. 나는 타자가 나를 보는 것같이 내가 존재한다는 것을 인정한다\"(p.489). 이것은 비교가 아니다 — 여기에는 기준도 대조표도 없고, \"수치심은 아무런 언어적 준비 없이 나의 머리끝에서 발끝까지 치닫는 직접적인 전율이다\"(p.489). 타자에게 나타난 대상은 타인의 정신 속 헛된 이미지가 아니다 — 이미지라면 나에게 \"타격을 줄(toucher)\" 수 없을 것이다(pp.488-489).",
    example:"내 초상화가 추하게 그려졌다면 화를 내면 그만이다. 그러나 수치심은 뼛속까지 타격을 입힌다 — 그것이 나의 존재에 관한 일이라는 증거다(p.489).", accent:"#6aaa82" },

  { id:"intermonadique", term:"상호 단자적 관계", latin:"relation intermonadique", keyword:"사람은 혼자서 야비한 것이 아니다",
    desc:"\"야비함(vulgarité)이라는 개념 자체에 상호 단자적 관계(relation intermonadique)가 함축되어 있다. 사람은 혼자서 야비한 것이 아니다\"(p.489). 타자는 단지 내가 있었던 그대로를 나에게 드러내 보인 것이 아니다. \"타자는 새로운 자격을 지니고 있어야 할 하나의 새로운 유형의 존재에 따라 나를 구성한 것이다. 이 존재는 타자의 출현 이전에 나의 내부에 가능태로 있었던 것이 아니다\"(p.489).",
    example:"'단자(모나드)'는 라이프니츠에게서 창 없는 방처럼 서로 통하지 않는 폐쇄된 개별 정신이다(각주 1). 사르트르의 단자는 다른 의식과의 관계 속에서 그 의미를 갖는다 — 야비함은 그 관계 속에서만 태어난다(p.489).", accent:"#5a9abc" },

  { id:"renvoi", term:"대자는 대타를 가리킨다", latin:"le pour-soi renvoie au pour-autrui", keyword:"두 개의 구조는 분리될 수 없다",
    desc:"(대자 = 자기 자신과 거리를 두며 존재하는 의식, 곧 나. 대타 = 타인에 대해 있는 나.) 수치심은 '타자 앞에서의' '자기에 대한' 수치심이다. \"이 두 개의 구조는 분리될 수 없다\"(p.490). \"나는 나의 존재의 구조 전체를 완전히 파악하기 위해서는 타자를 필요로 한다. 대자는 대타를 가리킨다\"(p.490). 그래서 두 가지 문제가 열린다 — 먼저 타자의 존재 문제, 그다음으로는 타자의 존재와의 나의 존재 관계의 문제(p.490).",
    example:"아이들의 교육은 그들이 있는 것에 대해 \"수치심을 느끼게 함으로써\" 이루어진다(p.490) — 타자 앞의 구조와 자기에 대한 구조가 한 몸이라는 일상의 증거다.", accent:"#aaba5a" },

  { id:"solipsisme", core:true, term:"유아론의 암초", latin:"l'écueil du solipsisme", keyword:"난공불락의 요새 속에 들어앉은 광인",
    desc:"나를 제외하고는 아무것도 존재하지 않는다는 가설. 고독의 긍정으로 표현되면 \"완전히 무상의 정당화되지 않은 순수한 형이상학적 가설\"이지만, 경험의 견고한 영역을 떠나기를 거부하는 실증적 시도로 나타나면 \"완전히 논리적\"이다(p.503). 왓슨의 행동주의처럼 정확하고 객관적이길 원하는 심리학까지도 결국 유아론만을 작업의 가설로 채택하고 있을 뿐이다(p.503).",
    example:"쇼펜하우어는 유아론자를 \"난공불락의 요새 속에 들어앉은 광인\"으로 다룬다. \"이것은 무기력의 고백이다\"(pp.503-504) — 논박은 못 하지만 아무도 그 요새 안에서 살지 않는다. 이 해결책은 \"우리의 존재가 가진 가장 심오한 성향\"에 반대된다(p.503).", accent:"#c4a35a" },

  { id:"absence", term:"부재로서의 타자의 영혼", latin:"une absence", keyword:"신체는 가리키기는 하지만 내주지는 않는다",
    desc:"실재론의 첫 좌초 지점. \"타자의 영혼은 나의 영혼에 직접 주어지지 않기 때문이다. 타자의 영혼은 하나의 부재이며, 하나의 의미이다. 신체는 그것을 가리키기는 하지만 그것을 내주지는 않는다. 한마디로 직관 위에 세워진 철학에서는 타자의 영혼에 대한 그 어떤 직관도 존재하지 않는다\"(p.492).",
    example:"나의 영혼이 타자의 신체에 직접 현전한다고 해도, 그의 영혼에 도달하기 위해서는 여전히 하나의 신체의 두께 전체를 지나가야 한다(p.492).", accent:"#9a7abd" },

  { id:"uncorps", term:"타자의 신체와 하나의 물체", latin:"le corps d'autrui · un corps", keyword:"실재론적 직관에 현전하는 것은 물체다",
    desc:"\"실재론적 직관에 현전하는 것은 타자의 신체(le corps d'autrui)가 아니라 하나의 물체(un corps)이다\"(p.493). 실재론의 입장은 생리학자가 생체의 총체성에서 메스로 살(chair) 한 점을 떼어 내는 것처럼 확실하게 신체를 죽여 버린 것과 같다(p.493). 기관이 유기체의 총체성 속에서만 살아 있는 기관이듯, \"신체는 정확히 그것이 인간실재라는 총체성의 분해될 수 없는 통일 속에 존재하는 한에서만 인간의 신체이다\"(p.492).",
    example:"돌 하나, 나무 한 그루, 양초 한 조각과 같이 따로 떼어 놓으면, 그것은 더 이상 누군가의 신체가 아니라 많은 양상과 특수한 \"소질\"을 가진 물체일 뿐이다(pp.492-493).", accent:"#c47a7a" },

  { id:"analogie", term:"유추에 의한 개연적 인식", latin:"par analogie · probable", keyword:"타자가 대상에 불과하다면 항상 개연적이다",
    desc:"19세기의 실재론적·실증적 심리학은 타자의 존재를 당연한 것으로 여기면서 인식의 수단에만 전념했다. 그 수단이란 내가 나 자신에 대해 알고 있는 것과의 유추(par analogie)다(pp.493-494). 그러나 \"이런 방법들은 단지 타자에 대해 개연적(probable) 인식만을 우리에게 줄 수 있을 뿐\"이며, \"타자가 하나의 대상에 불과하다는 사실은 항상 개연적이다\"(p.494).",
    example:"내가 이 얼굴에서 파악하는 것은 몇몇 근육의 수축뿐이다. 만일 동물이 기계라고 한다면, 거리에 지나가는 저 사람은 왜 기계 중 하나가 아닐까? 행동주의의 철저한 가설을 유추는 반박하지 못한다(p.494).", accent:"#6aaa82" },

  { id:"renversement", term:"실재론의 기묘한 전도", latin:"esse est percipi", keyword:"실재론은 타자 앞에서 관념론에 빠진다",
    desc:"심리학자들은 타자존재는 확실하고 그에 대한 인식은 개연적이라고 여기지만, 이 단언의 두 항을 뒤집어야 한다. 타자가 인식에 의해서만 접근되고 그 인식이 억측적(conjecturale)일 뿐이라면, 타자의 존재도 단지 억측적이다. \"실재론자는 외부 세계의 실재를 정립했기 때문에, 그는 타자의 존재를 고찰하면서 기묘한 전도에 의해 관념론에 빠지지 않을 수 없게 된다\"(p.494).",
    example:"신체가 실재적 대상이라면 타자(그의 의식)는 하나의 순수한 표상이 되며, 그의 있음(esse)은 단순한 지각됨(percipi)이 된다(p.494) — '존재는 지각됨이다', 버클리 관념론의 명제 그대로다. 그리고 대칭적으로, 관념론이 타인의 존재를 정립하면 즉시 형이상학적 실재론으로 떨어진다(p.504).", accent:"#5a9abc" },

  { id:"noumene", term:"본체 혼동의 오류", latin:"réalités nouménales", keyword:"타자는 다른 현상들을 가리키는 현상이다",
    desc:"칸트적 틀에서의 첫 교정. \"타자의 문제와 본체적 실재의 문제를 동일시하는 것은 완전한 잘못이다\"(p.496). 타자는 현상 배후의 예지적 실재가 아니다. \"타자는 다른 현상들을 가리키는 현상이다\" — 그가 나에 대해 느끼는 분노-현상을, 그의 내적 감각에 나타나는 일련의 사상을 가리키는 현상(p.497). \"내가 타자 안에서 겨냥하는 것은, 내가 나 자신 속에서 발견하는 것과 전혀 다를 바가 없다\"(p.497).",
    example:"타자의 분노가 의미를 갖는 것은 그것이 본성상 나의 통각(aperception — 여러 인상을 '나의 경험'으로 묶어 파악하는 일)을 거부하는 한에서다(p.497). 같은 현상이되, 원칙적으로 나의 경험 밖의 통일체를 가리키는 현상이다.", accent:"#aaba5a" },

  { id:"commesi", term:"\"마치 …인 것처럼\"의 범주", latin:"comme si", keyword:"타자를 규제적 가설로 밀어내는 칸트적 귀결",
    desc:"의식들의 관계는 본질상 생각될 수 없기 때문에, 타자라는 개념은 우리의 경험을 구성할 수 없고 규제적 개념 — 경험을 구성하지는 않지만 탐구를 인도하는 개념 — 으로 정리해야 할 것이 된다. \"타자는 '마치 …인 것처럼(comme si)'의 범주에 속한다\"(p.499). 그러나 이 자격마저 실패한다. 타자 개념은 허수처럼 계산 도중에만 개입하고 결과에서 제거되는 도구가 아니다 — \"타자라는 개념은 순전히 도구적 개념은 아니다\"(p.501).",
    example:"오히려 그 반대다 — \"어떤 범주의 현상들은 이 타자 개념을 위해서만 존재하는 것처럼 보인다\"(p.501). 타자의 감정·관념·의욕·성격, 내가 경험을 통해 계속 겨냥하는 그것들이다.", accent:"#9a7abd" },

  { id:"passystem", term:"나의 체계가 아닌 체계", latin:"ce système n'est pas le mien", keyword:"규제적 개념 자격마저 무너지는 지점",

  { id:"nepas", term:"외면성의 부정 · 주어진 무", latin:"ne-pas · un néant donné", keyword:"나는 폴이 아니다 = 탁자는 의자가 아니다?",
    desc:"문제의 근원 진단. 타자는 타인(l'autre), 즉 내가 아닌 나라는 전제 — 여기에서 부정이 타자-존재의 구성적 구조로 파악된다(pp.505-506). 관념론과 실재론에 공통되는 전제는 이 구성적 부정이 외면성의 부정이라는 것이다. \"이 있지-않음(ne-pas)은 타자와 나 자신 사이에 주어진 분리의 요소로서의 하나의 무를 가리킨다\"(p.506). 여러 의식 사이에 근원적인 공간 같은 것, \"정확히 하나의 주어진 무, 즉 수동적으로 경험한 하나의 절대적인 거리\"가 놓인다(p.506).",

  { id:"temoin", term:"제3의 인간과 증인으로서의 신", latin:"troisième homme · Dieu témoin", keyword:"외적 관계는 정립을 위해 증인을 요구한다",
    desc:"외면성 전제의 극한. 모든 외적 관계는 그 두 항 자체에 의해 구성되지 않는 한, 정립을 위해 한 명의 증인을 요구한다 — 관념론자는 자신도 모르게 \"제3의 인간(troisième homme)\"에 의거하고 있다(p.507). 그 최종 형태가 라이프니츠의 신이다. \"신은 나로 있고 타자로 있음과 동시에 나 자신으로 있지 않고 타자로도 있지 않다\"(p.508) — 신에의 의거는 무조건적으로 내적 부정에의 의거다(p.508).",

    example:"\"유아론을 피할 수 있어야 함과 동시에 신에의 의거도 없어야 할 것처럼 보인다. 이 관점에서 이 문제를 고찰하는 것이 가능한가?\"(p.510) — 이 물음을 들고 사르트르는 후설·헤겔·하이데거의 검토(3절)로 들어간다.", accent:"#bc7a7a" },

  { title:"논점 2 · 유아론의 암초 — 실재론과 관념론은 서로에게로 무너진다",

            </button>
          )}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
