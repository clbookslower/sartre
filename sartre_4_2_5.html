<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const CONCEPTS = [
  { id:"futurorig", term:"근원적 미래", latin:"futur originel", keyword:"현실적 즉자 저편의 즉자에 대한 현전의 가능성",
    desc:"미래의 출발 규정. \"근원적인 미래는, 현실적인 즉자 저편에 있는 하나의 즉자에 대한 현전이지만, 내가 현실 저편에 그것으로 있어야 하는 현전의 가능성이다\"(pp.473-474). 미래는 사물 안에 있지 않다. 내가 아직 안 된 나(가능)로서 현실 너머의 즉자에 현전하게 될 그 가능성이 미래다.",
    example:"내일의 책상은 지금 책상 안에 들어 있지 않다. 그것은 내가 내일 마주하게 될 책상으로서, 내 가능에서부터 그려지는 하나의 현전이다(pp.473-474).", accent:"#c4a35a" },

  { id:"copresence", term:"미래적 공현전", latin:"coprésence future", keyword:"나의 미래는 미래적 세계를 불러일으킨다",
    desc:"\"나의 미래는 미래적인 공현전으로서 하나의 미래적인 세계에 대한 소묘를 불러일으킨다\"(p.474). 내가 그것으로 있을 대자에게 드러나는 것은 대자의 가능성 자체가 아니라 이 미래적 세계다. 나의 가능은 늘 하나의 미래적 세계와 함께 그려진다.",
    example:"\"이 일을 끝낸 나\"를 향할 때, 함께 떠오르는 것은 그 일이 끝난 세계의 모습이지 내 마음속 가능 자체가 아니다(p.474).", accent:"#9a7abd" },

  { id:"futurensoi", term:"즉자의 미래", latin:"futur de l'en-soi", keyword:"변양된 현재적 즉자",
    desc:"\"즉자의 미래는 변양된 현재적인 즉자이다. 왜냐하면 나의 미래는 내가 변양시킬 하나의 즉자에 대한 나의 현전의 가능성일 뿐이기 때문이다\"(p.474). 사물의 미래는 사물이 스스로 가진 것이 아니라, 내가 그것을 변양시킬 가능성으로서 그것에 입혀진다.",
    example:"잉크병의 \"비워질\" 미래는 잉크병이 품은 게 아니라, 내가 그것을 비울 가능성으로서 거기 비친 것이다 — 변양된 현재의 잉크병(p.474).", accent:"#c47a7a" },

  { id:"futurmonde", term:"세계의 미래 · 잠재성", latin:"futur du monde · potentialités",
    keyword:"항상성·본질에서 여러 잠재태까지의 층위",
    desc:"\"세계의 미래는 사물의 단순한 항상성과 순수한 본질에서부터 여러 잠재태에까지 이르는 잠재성들의 층위로 이루어져 있다\"(p.474). 사물을 책상·잉크병으로 파악하며 그 본질을 고정하자마자, 나는 이미 저기 미래에 존재한다. 도구-사물로 나타나자마자 그 구조와 특질은 단번에 미래 속에 놓인다.",
    example:"망치를 망치로 보는 순간, 그것의 \"내려쳐질\" 미래가 이미 함께 온다. 도구성 자체가 미래를 가리킨다(p.474).", accent:"#6aaa82" },

  { id:"avenir", term:"보편적 장래", latin:"avenir universel", keyword:"미래들의 등가물 위계를 나타내는 추상적 테두리",
    desc:"\"보편적인 장래를 미래들이라고 하는 등가물의 위계를 나타내는 추상적인 테두리로 보아야 한다\"(p.475). 그것은 상호적 외면성들의 용기이면서 그 자신이 외면성인 용기다. 무차별적인 '지금들'이 외적 부정의 관계로 결합된, 현재에 대해 외적인 텅 빈 용기들의 계열이다.",
    example:"\"미래 전체\"라는 것은 어떤 실체가 아니라, 일어날 수 있는 일들이 담기는 텅 빈 추상적 틀이다 — 그 자체로는 비어 있는 용기(p.475).", accent:"#5a9abc" },

  { id:"neantensoi", term:"즉자적 무 (장래)", latin:"un néant en-soi", keyword:"존재 저편의 순수한 분산으로서의 장래",
    desc:"장래의 한 양상. \"어떤 때는 이 장래가 존재 저편의 순수한 분산인 한에서, 이 장래는 하나의 즉자적인 무(un néant en-soi)로 드러난다\"(p.475). 때로 장래는 긴급함·위협으로, 때로 단순한 외면성으로, 때로 즉자적 무로 나타난다. 그것을 채우는 것과 무관한 공간과 동질적인 형식적 용기다.",
    example:"막연히 \"앞으로\"를 떠올릴 때, 아무 내용 없이 텅 빈 시간의 펼쳐짐만 느껴질 때가 있다 — 즉자적 무로서의 장래(p.475).", accent:"#aaba5a" },

  { id:"atemporal", term:"초시간성", latin:"a-temporalité", keyword:"비시간적 이것이 시간 차원과 함께 주는 것",
    desc:"\"비시간적인 이것은 시간적인 차원들을 통해 우리에게 그 초시간성(a-temporalité) 자체와 함께 주어진다\"(p.476). 시간 차원이 대상 위에 나타날 때 대상은 즉자존재·객관성·무차별적 외면성·절대적 분산이라는 새 성질을 띤다. 사물은 시간을 통해 오히려 자신의 시간 너머의 본성을 드러낸다.",
    example:"잉크병은 시간 속에서 마주치지만, 잉크병이라는 그 즉자적 본질 자체는 시간의 흐름에 속하지 않는다. 시간 차원을 통해 오히려 그 초시간성이 함께 드러난다(p.476).", accent:"#c4a35a" },

  { id:"cohesion", term:"시간의 접착", latin:"cohésion", keyword:"인간실재의 동적 접착의 객관적 반영 — 환영",
    desc:"과거·현재·미래가 들러붙어 하나의 시간을 이루는 결속(각주 117). \"시간의 접착은, 대자가 자기 자신을 향해 탈자적으로 수행하는 기투… 인간실재의 동적인 접착의 객관적인 반영이고, 하나의 단순한 환영이다\"(p.476). 시간을 그 자체로 보면 이 접착은 존재 이유가 없고, 순간들의 절대적 다수성으로 해체된다.",
    example:"\"어제-오늘-내일이 하나로 이어진다\"는 느낌은 사물의 성질이 아니라, 내가 나를 향해 던지는 운동이 사물 위에 비친 그림자다 — 환영적 접착(p.476).", accent:"#9a7abd" },

  { id:"laps", term:"기간", latin:"laps du temps", keyword:"시간의 무차별한 바탕 위로 떠오르는 특이한 형태",
    desc:"시간의 한 단위. \"이 존재는 시간의 무차별한 바탕 위로 떠오르는 하나의 특이한 형태의 존재이고, 우리가 [시간의] 기간(laps du temps)이라고 부르게 될 존재이다\"(p.476, 후설의 '시간 길이'를 사르트르가 새로 명명—각주 118). 객관적 시간에 대한 우리의 최초 파악은 실천적(pratique)이다.",
    example:"\"이 일을 하는 데 걸리는 시간\"처럼 행위와 함께 떠오르는 한 토막의 시간 — 균질한 시간의 바탕 위로 솟은 의미 있는 기간(p.476).", accent:"#c47a7a" },

  { id:"comprime", term:"압축과 감압", latin:"comprimé · décompression", keyword:"절대적 감압 한가운데의 시간의 압축",
    desc:"\"기간은 하나의 절대적인 감압(décompression) 한가운데에서 일어나는 시간의 압축(comprimé)이다. 이것은 압축을 실현하는 우리의 가능들을 향한 우리 자신의 기투이다\"(p.477). 시간의 압축은 세계 속에서 나를 나 자신으로부터 분리하는 거리를 표현한다. 시간은 궤적들을 통해 나타난다.",
    example:"마감을 향해 \"시간을 당겨 쓰는\" 긴장은, 흩어진 시간(감압)을 하나의 행위로 모으는 압축이다 — 내 가능을 향한 기투의 시간 형태(p.477).", accent:"#6aaa82" },

  { id:"tempsn8eant", term:"보편적 시간은 즉자적 무", latin:"le Temps universel, néant en-soi", keyword:"객관적 시간은 행위에 의해서만 존재를 갖는다",
    desc:"4절의 결론. 무라고 규정되는 것은 즉자 위에 투사된 객관적·보편적 시간이지, 대자의 근원적 시간성(2부 2장)이 아니다. \"시간은 단순한 즉자적인 무이며, 이 무는 대자가 그것을 이용하기 위해 뛰어넘는 행위 자체에 의해서만 하나의 존재를 가질 수 있는 것으로 보일 뿐이다\"(p.476). 보편적 시간은 초시간적인 존재자의 표면에서 일어나는 무의 반짝임으로 드러난다(p.478).",
    example:"세계 속에서 흐르는 듯 보이는 객관적 시간은 그 자체로는 아무것도 아니다. 다만 내가 그것을 발판 삼아 미래로 나를 던질 때, 비로소 시간이 '있는' 것처럼 반짝인다(pp.476-478).", accent:"#5a9abc" },

  { id:"connaissance", term:"인식", latin:"connaissance", keyword:"존재의 대자에 대한 현전 외의 아무것도 아니다",
    desc:"5절의 핵심 규정. \"인식은 존재의 대자에 대한 현전 외의 아무것도 아니고, 대자는 이 현전을 실현하는 아무것도 아닌 것일 뿐이다\"(p.478). 인식은 본성상 탈자적 존재이며 대자의 탈자적 존재와 뒤섞인다. 대자는 나중에 인식하기 위해 존재하는 것이 아니다 — 대자의 존재가 곧 존재에 대한 인식이다.",
    example:"내가 책상을 \"안다\"는 것은 내 안에 책상의 상(像)이 생기는 일이 아니라, 책상이 나에게 현전하는 그 사태 자체다 — 인식은 곧 현전(p.478).", accent:"#c4a35a" },

  { id:"negposit", term:"지향적 긍정 · 내적 부정", latin:"affirmation · négation interne", keyword:"지향적 긍정은 내적 부정의 이면이다",
    desc:"인식의 내적 구조. \"대자는 자기에 대한 자신의 부정을 통해 즉자에 대한 긍정이 된다. 지향적인 긍정은 내적 부정의 이면과 같다\"(p.479). 내가 즉자를 긍정하는 것은 내가 그 즉자가 아니라는 내적 부정을 통해서다. 그래서 대자는 즉자에 \"긍정적인 부정\"(즉자가 거기 있었다는 사실) 말고는 아무것도 덧붙이지 않는다(p.480). 세계·도구·공간·양은 실체화된 순수한 무이며, 드러나는 순수한 존재를 전혀 변경하지 않는다.",
    example:"내가 바위를 본다고 바위에 무언가 더해지지 않는다. 다만 \"바위가 거기 있다\"는 긍정이, 내가 바위가 아니라는 내적 부정의 이면으로서 드러날 뿐이다(pp.479-480).", accent:"#9a7abd" },

  { id:"passion", term:"대자의 수난", latin:"passion du pour-soi", keyword:"세계로서의 긍정이 즉자에 이르려 자기를 상실한다",
    desc:"인식의 존재론적 드라마(각주 119, 그리스도 수난에 빗댐). \"모든 것은 마치 '세계'로서의 긍정이 즉자에 이르기 위해 스스로 자기를 상실하는 대자의 수난(passion du pour-soi)처럼 진행된다\"(p.479). 대자는 자기에 대한 부정을 통해 즉자에 대한 긍정이 된다 — 긍정은 즉자의 모험이다.",
    example:"의식은 세계가 '거기 있게' 하기 위해 자기를 비운다. 세계를 드러내려 스스로를 무화하는 이 자기 상실이 대자의 수난이다(p.479).", accent:"#c47a7a" },

  { id:"sansdistance", term:"거리 없이", latin:"sans distance", keyword:"모든 것이 전적인 실재성으로 나에게 현전한다",
    desc:"실재론적 직접성. \"모든 것은 거리 없이(sans distance) 나에게 그 전적인 실재성 속에서 나에 대해 현전하고 있다… 내가 보는 것의 바깥에는 아무것도 없다. 존재는 나의 주위에 모든 곳에 있다\"(p.480). 심적 사건인 '표상'은 철학자들이 고안한 것이다 — 존재는 표상을 거치지 않고 직접 나를 포위한다.",
    example:"산을 볼 때 나와 산 사이에 '산의 이미지'라는 중간물은 없다. 산 자체가 거리 없이 거기 있다(p.480).", accent:"#6aaa82" },

  { id:"mondehumain", term:"세계는 인간적이다", latin:"le monde est humain", keyword:"세계의 모든 구조는 대자의 부정에서 온다",
    desc:"3장 초월의 결론. \"세계성(mondanité), 공간성, 양, 도구성, 시간성 등은 내가 존재에 대한 부정이기 때문에만 존재에게 올 뿐이다. 그것들은 존재에 아무것도 덧붙이지 않는다… 세계는 인간적이다\"(pp.480-481). 존재는 그대로 두면서, 그 위의 모든 구조는 대자에게서 온다.",
    example:"시간도, 공간도, 도구성도 사물이 스스로 가진 게 아니다. 세계의 모든 짜임은 인간(대자)이 거기 들여놓은 것이다 — 세계는 인간적이다(p.481).", accent:"#aaba5a" },

  { id:"antikant", term:"관념론·실재론을 넘어서", latin:"au-delà de l'idéalisme et du réalisme",
    keyword:"칸트적 상대주의에서 벗어난다",
    desc:"5절의 입장 정립. 인식이 존재에 대한 현전이라는 점에서 관념론에 동의하되 '인식이라는 하나의 존재'를 덧붙이고(p.478), 의식에 현전하는 것이 존재 자체라는 점에서 실재론을 인정한다(p.480). \"우리는 그 점에서 칸트적인 상대주의에서 벗어난다\"(p.481) — 존재가 대자에 상대적인 것은 존재의 성질이 아니라 대자의 '거기에 존재함'에 있어서다.",
    example:"존재는 내 마음의 구성물도(관념론), 나와 무관한 즉물도(소박실재론) 아니다. 그것은 거리 없이 거기 있으되, 오직 대자에게만 '거기 있다'(p.481).", accent:"#5a7abc" },

  { id:"pourautrui", term:"대타존재", latin:"l'être-pour-autrui", keyword:"신체는 타자에 의해 인식된다 — 다음 연구로의 문",

        return (
          <div key={i} style={{ marginBottom:20, background:C.surf, padding:"22px 26px", borderLeft:`3px solid ${STAGES.rhetoric.color}${i%2===0?"cc":"44"}` }}>
            <div style={{ display:"flex", gap:16, alignItems:"flex-start", marginBottom:12 }}>
              <span style={{ fontFamily:F.h, fontSize:28, color:STAGES.rhetoric.color, lineHeight:1, minWidth:34 }}>S{i+1}</span>
              <p style={{ ...BD, fontWeight:400, lineHeight:1.8, margin:0, flex:1 }}>{item.q}</p>
            </div>
            <div style={{ paddingLeft:50 }}>
              <button onClick={()=>{const n=new Set(seminHints);if(n.has(i))n.delete(i);else n.add(i);setSeminHints(n);}}
                style={{ background:"transparent", border:"none", color:C.muted, fontFamily:F.b, fontSize:11, letterSpacing:3, cursor:"pointer", padding:0 }}>
                {open?"힌트 접기 ↑":"힌트 보기 ↓"}
              </button>
              {open && (
                <div style={{ marginTop:10, padding:"12px 16px", background:C.surfUp, borderLeft:`2px solid ${STAGES.rhetoric.color}33` }}>
                  <p style={{ ...MT, fontSize:13, fontStyle:"italic", margin:0, lineHeight:1.8 }}>💡 {item.hint}</p>
                  <p style={{ fontFamily:F.b, fontSize:11, color:C.gold, letterSpacing:2, margin:"10px 0 0 0", paddingTop:8, borderTop:`1px dashed ${C.line}` }}>↳ {item.source}</p>
                </div>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );

  case 10: return (
    <div style={{ minHeight:"100vh", display:"flex", flexDirection:"column", justifyContent:"center", alignItems:"center", textAlign:"center", padding:"48px 28px", background:C.bg, position:"relative" }}>
      <div style={{ position:"absolute", top:0, left:0, right:0, height:1, background:`linear-gradient(90deg,transparent,${C.gold}44,transparent)` }} />
      <span style={{ fontFamily:F.b, fontSize:11, letterSpacing:6, color:"#d4b46a", marginBottom:48, display:"block", fontWeight:500 }}>생각학교 ASK · 존재와 무 클래스</span>
      <div style={{ width:1, height:64, background:`linear-gradient(${C.gold}88,transparent)`, margin:"0 auto 44px" }} />
      <div style={{ background:C.surf, padding:"36px 40px", maxWidth:640, textAlign:"left", borderLeft:`3px solid ${C.gold}`, marginBottom:52 }}>
        <p style={{ fontSize:11, color:C.gold, letterSpacing:4, marginBottom:20, fontWeight:500 }}>오늘의 마지막 문장 · Jean-Paul Sartre</p>
        <p style={{ fontFamily:F.h, fontSize:"clamp(15px,2.2vw,18px)", fontStyle:"italic", color:C.txt, lineHeight:2.2, margin:0 }}>
          "세계성, 공간성, 양, 도구성, 시간성 등은 내가 존재에 대한 부정이기 때문에만 존재에게 올 뿐이다. 그것들은 존재에 아무것도 덧붙이지 않는다. <span style={{ color:C.goldBr }}>세계는 인간적이다</span>."
        </p>
        <p style={{ fontFamily:F.b, fontSize:13, color:"#c8b896", marginTop:20, marginBottom:0, letterSpacing:2, fontWeight:500 }}>— 『존재와 무』 2부 3장 5절 인식, pp.480-481</p>
      </div>
      <div style={{ display:"flex", gap:32, marginBottom:52, justifyContent:"center" }}>
        {[["문법","Grammar","#c4a35a"],["논리","Logic","#5a9abc"],["수사","Rhetoric","#bc7a7a"]].map(([l,e,col])=>(
          <div key={l} style={{ textAlign:"center" }}>
            <div style={{ width:5, height:5, borderRadius:"50%", background:col, margin:"0 auto 8px" }} />
            <p style={{ fontFamily:F.b, fontSize:11, color:col, letterSpacing:3, marginBottom:5 }}>{l}</p>
            <p style={{ fontFamily:F.h, fontSize:13, color:C.muted, margin:0, fontStyle:"italic" }}>{e}</p>
          </div>
        ))}
      </div>
      <button onClick={()=>go(0)} style={{ background:"transparent", border:`1px solid ${C.line}`, color:C.muted, fontFamily:F.b, fontSize:11, letterSpacing:4, padding:"12px 32px", cursor:"pointer" }}>처음으로</button>
    </div>
  );

  default: return null;
  }};

  const navVisible = page>0 && page<10;
  return (
    <div style={{ background:C.bg, minHeight:"100vh" }}>
      {navVisible && (
        <div style={{ position:"fixed", top:0, left:0, right:0, height:2, background:C.line, zIndex:100 }}>
          <div style={{ height:"100%", width:`${((page-1)/8)*100}%`, background:stage?stage.color:C.gold, transition:"width 0.4s ease, background 0.4s ease" }} />
        </div>
      )}
      <div style={{ opacity:fading?0:1, transition:"opacity 0.28s ease", paddingTop:navVisible?2:0 }}>
        {renderPage()}
      </div>
      {navVisible && (
        <div style={{ maxWidth:720, margin:"0 auto", padding:"0 28px 52px", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
          <button onClick={prev} style={{ background:"transparent", border:"none", color:C.muted, fontFamily:F.b, fontSize:12, letterSpacing:3, cursor:"pointer", padding:"12px 0" }}>← 이전</button>
          <div style={{ display:"flex", gap:4, alignItems:"center" }}>
            {Array.from({length:9},(_,i)=>{
              const ps=PAGE_STAGE[i+2], col=ps?STAGES[ps].color:C.gold, active=i===page-2, done=i<page-2;
              return <div key={i} style={{ width:active?8:5, height:active?8:5, borderRadius:"50%", background:done||active?col:C.line, transition:"all 0.3s" }} />;
            })}
          </div>
          {page<9 ? (
            <button onClick={next} style={{ background:"transparent", border:"none", color:stage?stage.color:C.gold, fontFamily:F.b, fontSize:12, letterSpacing:3, cursor:"pointer", padding:"12px 0" }}>다음 →</button>
          ) : (
            <button onClick={next}
              onMouseEnter={e=>{e.currentTarget.style.background=STAGES.rhetoric.color;e.currentTarget.style.color=C.bg;}}
              onMouseLeave={e=>{e.currentTarget.style.background="transparent";e.currentTarget.style.color=STAGES.rhetoric.color;}}
              style={{ background:"transparent", border:`1px solid ${STAGES.rhetoric.color}`, color:STAGES.rhetoric.color, fontFamily:F.b, fontSize:11, letterSpacing:3, padding:"10px 24px", cursor:"pointer", transition:"all 0.3s" }}>
              마무리
            </button>
          )}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
